[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lumis-sdk"
version = "0.1.0rc1"
description = "Experimental evidence-grounded operational intelligence for complex systems."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Solomon Eshun", email = "solomoneshun373@gmail.com" }]
keywords = ["operational-intelligence", "hypothesis-testing", "incident-management", "observability"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "networkx>=3.4,<4",
  "pydantic>=2.13.5,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
http = ["httpx>=0.28,<1"]
sql = ["psycopg[binary]>=3.2,<4"]
agent = ["httpx>=0.28,<1", "httpx2>=2.13,<3", "pydantic-ai-slim[openrouter,openai,anthropic,google]>=2.54,<3"]

[project.urls]
Homepage = "https://github.com/soloshun/lumis-sdk"
Documentation = "https://github.com/soloshun/lumis-sdk/blob/dev/docs/README.md"
Repository = "https://github.com/soloshun/lumis-sdk"
Issues = "https://github.com/soloshun/lumis-sdk/issues"

[project.scripts]
lumis = "lumis_sdk.cli:main"

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "mypy>=1.14,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.9,<1",
  "types-pyyaml>=6.0.12,<7",
  "types-networkx>=3.4,<4",
  "httpx>=0.28,<1",
  "httpx2>=2.13,<3",
  "pydantic-ai-slim[openrouter,openai,anthropic,google]>=2.54,<3",
  "psycopg[binary]>=3.2,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lumis_sdk"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/GOVERNANCE.md",
  "/LICENSE",
  "/README.md",
  "/ROADMAP.md",
  "/SECURITY.md",
  "/SUPPORT.md",
  "/docs",
  "/pyproject.toml",
  "/schemas",
  "/scripts",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true
warn_unreachable = true
