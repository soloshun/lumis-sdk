version: 2
# Routine version updates: first day of each month, one grouped PR per ecosystem.
# This file must also be kept on main (GitHub's default branch) to take effect.
# Security alerts/updates are separate; this schedule does not disable them.
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Africa/Accra
    labels: [dependencies, github-actions]
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Africa/Accra
    labels: [dependencies, python]
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns: ["*"]
