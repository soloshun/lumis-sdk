name: Pull request dependency review

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Vulnerability and license review
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.17"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.11
      - name: Audit locked dependencies
        run: uv audit --locked
      - name: Review core dependency licenses
        run: |
          uv run --with pip-licenses pip-licenses --format=json --with-system > licenses-core.json
          uv run python scripts/check_dependency_licenses.py licenses-core.json
