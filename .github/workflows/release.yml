name: Release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version declared in pyproject.toml
        required: true
        type: string
      target:
        description: Package index
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.target }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.17"
      - run: uv python install 3.11
      - name: Verify release source and declared version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF_NAME" = main
          test "$(uv version --short)" = "$RELEASE_VERSION"
          uv sync --locked --all-groups
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src
          uv run python scripts/generate_config_schema.py --check
          uv run pytest
          uv audit --locked
          uv run bandit --recursive --severity-level medium --confidence-level medium src
      - name: Build and verify reproducibility
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          uv build --no-sources --out-dir dist
          uv run python scripts/verify_release_artifacts.py dist \
            --distribution lumis-sdk --version "$RELEASE_VERSION"
          uv build --no-sources --out-dir dist-rebuild
          diff <(cd dist && sha256sum *.whl *.tar.gz) \
               <(cd dist-rebuild && sha256sum *.whl *.tar.gz)
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Attest SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-sbom
          path: sbom.spdx.json
          if-no-files-found: error

  clean-install:
    needs: verify-and-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.17"
      - run: uv python install ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - name: Verify wheel and source archive in empty environments
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-wheel
          uv pip install --python .venv-wheel/bin/python dist/*.whl
          .venv-wheel/bin/lumis init --directory /tmp/lumis-wheel
          .venv-wheel/bin/lumis doctor --project /tmp/lumis-wheel/lumis.yaml
          .venv-wheel/bin/lumis investigate --project /tmp/lumis-wheel/lumis.yaml \
            --incident /tmp/lumis-wheel/incident.json --observations /tmp/lumis-wheel/observations.json
          uv venv --python ${{ matrix.python-version }} .venv-sdist
          uv pip install --python .venv-sdist/bin/python dist/*.tar.gz
          .venv-sdist/bin/lumis --version

  publish:
    needs: [verify-and-build, clean-install]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
