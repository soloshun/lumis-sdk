name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.17"
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --frozen --all-groups --python ${{ matrix.python-version }}
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run python scripts/generate_config_schema.py --check
      - run: uv run pytest
      - run: uv build
      - name: Verify standalone wheel with no HTTP extra or consuming application
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-smoke
          uv pip install --python .venv-smoke/bin/python dist/*.whl
          .venv-smoke/bin/lumis --version
          .venv-smoke/bin/lumis init --directory /tmp/lumis-smoke
          .venv-smoke/bin/lumis doctor --project /tmp/lumis-smoke/lumis.yaml
          .venv-smoke/bin/lumis discover --project /tmp/lumis-smoke/lumis.yaml
          .venv-smoke/bin/lumis discover --project /tmp/lumis-smoke/lumis.yaml --report > /tmp/discovery.json
          jq -e '.complete == true' /tmp/discovery.json
          .venv-smoke/bin/lumis graph --project /tmp/lumis-smoke/lumis.yaml --entity service:demo --format dot
          .venv-smoke/bin/python -c 'from lumis_sdk.runtime import YamlProject; from lumis_sdk.graph import OperationalGraph; import networkx'
          .venv-smoke/bin/lumis investigate \
            --project /tmp/lumis-smoke/lumis.yaml \
            --incident /tmp/lumis-smoke/incident.json \
            --observations /tmp/lumis-smoke/observations.json \
            > /tmp/investigation.json
          jq -e '.outcome == "supported" and .truth_state == "unconfirmed_hypothesis"' /tmp/investigation.json
          .venv-smoke/bin/lumis graph --project /tmp/lumis-smoke/lumis.yaml --format svg --output /tmp/graph.svg
          .venv-smoke/bin/lumis incident --project /tmp/lumis-smoke/lumis.yaml \
            --incident /tmp/lumis-smoke/incident.json \
            --observations /tmp/lumis-smoke/observations.json > /tmp/incident-report.json
          jq -e '.route == "human" and .requires_human_review == true and .truth_state == "unconfirmed_hypothesis"' /tmp/incident-report.json

  sandbox:
    name: Diagnostic sandbox conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LUMIS_TEST_SANDBOX_IMAGE: python@sha256:dddfd7e07f9d15aeeca61529320492139d21cac7f0070c00609243e51e4e0016
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.17"
      - run: uv sync --frozen --all-groups --python 3.12
      - name: Preload operator-approved image (runner never pulls implicitly)
        run: docker pull "$LUMIS_TEST_SANDBOX_IMAGE"
      - run: uv run pytest tests/test_investigation_safety.py tests/test_incident_agent.py -q
