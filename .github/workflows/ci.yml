name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.17"
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --frozen --all-groups --python ${{ matrix.python-version }}
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run python scripts/generate_config_schema.py --check
      - run: uv run pytest
      - run: uv build
      - name: Verify standalone wheel with no HTTP extra or consuming application
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-smoke
          uv pip install --python .venv-smoke/bin/python dist/*.whl
          .venv-smoke/bin/lumis --version
          .venv-smoke/bin/lumis init --directory /tmp/lumis-smoke
          .venv-smoke/bin/lumis doctor --project /tmp/lumis-smoke/lumis.yaml
          .venv-smoke/bin/lumis discover --project /tmp/lumis-smoke/lumis.yaml
          .venv-smoke/bin/lumis investigate \
            --project /tmp/lumis-smoke/lumis.yaml \
            --incident /tmp/lumis-smoke/incident.json \
            --observations /tmp/lumis-smoke/observations.json \
            > /tmp/investigation.json
          jq -e '.outcome == "supported" and .truth_state == "unconfirmed_hypothesis"' /tmp/investigation.json
